<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolchi Mojod Store | كلشي موجود</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#2536b8;--saffron:#f2b33d;--chalk:#faf7f2;--ink:#1b1b2f;--line:#e4dfd3}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,Tahoma,sans-serif;background:var(--chalk);color:var(--ink);line-height:1.6}
header{background:var(--blue);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-family:'Reem Kufi',serif;font-size:1.4rem}
.logo small{display:block;font-family:Tajawal;font-size:.75rem;opacity:.8}
.cartbtn{background:var(--saffron);color:var(--ink);border:0;padding:8px 14px;border-radius:8px;font:700 .95rem Tajawal;cursor:pointer}
.hero{padding:36px 16px 20px;max-width:900px;margin:auto}
.hero h1{font-family:'Reem Kufi',serif;font-size:2rem;line-height:1.3}
.hero p{margin-top:8px;color:#555}
.cats{display:flex;gap:10px;padding:8px 16px 18px;max-width:900px;margin:auto;overflow-x:auto}
.cats button{flex:1;min-width:110px;padding:12px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:10px;font:700 1rem Tajawal;cursor:pointer}
.cats button.on{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:0 16px 40px;max-width:900px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#ece6d6;display:block}
.card div.b{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.price{font-weight:700;color:var(--blue)}
.card button{margin-top:auto;background:var(--ink);color:#fff;border:0;padding:9px;border-radius:8px;font:500 .9rem Tajawal;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:#777;padding:30px}
footer{text-align:center;padding:20px;font-size:.85rem;color:#777}
#drawer{position:fixed;inset:0;background:#0007;display:none;z-index:9}
#drawer.open{display:block}
.panel{position:absolute;inset-inline-start:0;top:0;bottom:0;width:min(360px,92%);background:#fff;padding:18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}
.row button{border:0;background:none;color:#c0392b;font-size:1.1rem;cursor:pointer}
.send{background:#1fa855;color:#fff;border:0;padding:12px;border-radius:10px;font:700 1rem Tajawal;cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="logo">كلشي موجود<small>Kolchi Mojod Store</small></div>
  <button class="cartbtn" id="open">السلة <span id="count">0</span></button>
</header>

<section class="hero">
  <h1>ملابس، عناية، وإلكترونيات في مكان واحد</h1>
  <p>اختر المنتج وأكّد طلبك عبر واتساب، والدفع عند الاستلام.</p>
</section>

<nav class="cats" id="cats"></nav>
<main class="grid" id="grid"></main>
<footer>© Kolchi Mojod Store — جميع الحقوق محفوظة</footer>

<div id="drawer">
  <div class="panel">
    <div class="row"><b>سلة الطلبات 🛒</b><button id="close" aria-label="إغلاق">×</button></div>
    <div id="items"></div>
    <div class="row"><b>المجموع:</b><b id="total">0 د.م</b></div>
    <button class="send" id="send">تأكيد الطلب عبر واتساب 📲</button>
  </div>
</div>

<script>
‎// ====== عدّل هنا ======
const WHATSAPP = "212718517703";

const CATEGORIES = [
  {id:"clothes",  name:"ملابس"},
  {id:"beauty",   name:"مستحضرات وعناية"},
  {id:"tech",     name:"إلكترونيات"}
];

‎// لإضافة منتج: انسخ سطرًا وغيّر البيانات. الصورة تُوضع في مجلد images
const PRODUCTS = [
  {id:1, cat:"clothes", name:"قناع حراري صوفي (Balaclava)", price:100, img:"images/balaclava.jpg"},
  {id:2, cat:"beauty",  name:"منتج تجريبي للعناية", price:80, img:"images/beauty1.jpg"},
  {id:3, cat:"tech",    name:"منتج تجريبي إلكتروني", price:150, img:"images/tech1.jpg"}
];
// =====================

let current = "clothes", cart = {};
const $ = id => document.getElementById(id);

function drawCats(){
  $("cats").innerHTML = CATEGORIES.map(c =>
    `<button class="${c.id===current?'on':''}" data-c="${c.id}">${c.name}</button>`).join("");
}
function drawProducts(){
  const list = PRODUCTS.filter(p => p.cat===current);
  $("grid").innerHTML = list.length ? list.map(p => `
    <article class="card">
      <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.removeAttribute('src')">
      <div class="b"><span>${p.name}</span><span class="price">${p.price} د.م</span>
      <button data-add="${p.id}">أضف إلى السلة</button></div>
    </article>`).join("") : `<p class="empty">لا توجد منتجات في هذه الفئة بعد.</p>`;
}
function drawCart(){
  const ids = Object.keys(cart);
  let total = 0, n = 0;
  $("items").innerHTML = ids.length ? ids.map(id => {
    const p = PRODUCTS.find(x => x.id==id), q = cart[id];
    total += p.price*q; n += q;
    return `<div class="row"><span>${p.name} × ${q}</span><span>${p.price*q} د.م <button data-del="${id}" aria-label="حذف">🗑</button></span></div>`;
  }).join("") : `<p class="empty">السلة فارغة</p>`;
  $("total").textContent = total + " د.م";
  $("count").textContent = n;
}
document.addEventListener("click", e => {
  const t = e.target;
  if(t.dataset.c){current = t.dataset.c; drawCats(); drawProducts();}
  if(t.dataset.add){cart[t.dataset.add] = (cart[t.dataset.add]||0)+1; drawCart();}
  if(t.dataset.del){delete cart[t.dataset.del]; drawCart();}
  if(t.id==="open") $("drawer").classList.add("open");
  if(t.id==="close" || t.id==="drawer") $("drawer").classList.remove("open");
  if(t.id==="send"){
    const ids = Object.keys(cart);
    if(!ids.length) return alert("السلة فارغة");
    let total = 0;
    const lines = ids.map(id => {const p = PRODUCTS.find(x=>x.id==id); total += p.price*cart[id]; return `- ${p.name} × ${cart[id]} = ${p.price*cart[id]} د.م`;});
    const msg = `السلام عليكم، أريد طلب:\n${lines.join("\n")}\nالمجموع: ${total} د.م`;
    window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, "_blank");
  }
});
drawCats(); drawProducts(); drawCart();
</script>
</body>
</html>
